<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOORBUSTER Level Editor</title>
<link rel="icon" href="data:,">
<!--
  DOORBUSTER — editor/index.html
  Purpose: the level editor's page: top bar, palette (left), map canvas (middle), inspector (right), status bar, the
           test-drive overlay and dialogs. A development tool: not part of the shipped game (index.html + src/).
  Loads: editor.js (ES module). Open it through the project's server: npm run serve, then /editor/.
  Look: the game's receipts and price tags (index.html): paper panels, ink outlines, yellow sale plates.
-->
<style>
  :root { --night: #1E1B2E; --deep: #120F1D; --sale: #FFD23F; --danger: #FF3B4E; --warn: #FFB703; --pink: #FF4FA3; --teal: #00D1C1;
    --paper: #FFFDF6; --paper2: #F4EEE2; --ink: #2A1A3A; --soft: rgba(42,26,58,.55); --line: rgba(42,26,58,.18);
    --head: "Arial Black", "Segoe UI Black", system-ui, sans-serif; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: grid; grid-template: 54px minmax(0, 1fr) 30px / 268px minmax(0, 1fr) 340px; background: var(--night); color: var(--ink);
    font: 13px/1.35 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---- top bar */
  #top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--deep); border-bottom: 3px solid var(--ink); }
  .brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .plate { font: 900 17px var(--head); background: var(--sale); color: var(--ink); padding: 3px 10px 2px; border: 3px solid var(--ink); border-radius: 6px;
    box-shadow: 3px 3px 0 var(--pink); transform: rotate(-2deg); letter-spacing: .02em; }
  .brand b { font: 900 13px var(--head); color: #fff; letter-spacing: .12em; }
  nav { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
  .sep { width: 1px; height: 26px; background: #3A3450; margin: 0 4px; }
  #top button, .btn { height: 32px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 7px; background: var(--paper); cursor: pointer;
    font: 900 12px var(--head); letter-spacing: .03em; box-shadow: 2px 2px 0 rgba(0,0,0,.35); white-space: nowrap; }
  #top button:hover, .btn:hover { background: #fff; transform: translateY(-1px); }
  #top button:active, .btn:active { transform: translateY(1px); box-shadow: none; }
  #top button.hot, .btn.hot { background: var(--pink); color: #fff; }
  #top button.go, .btn.go { background: var(--sale); }
  #top button:disabled { opacity: .45; cursor: default; transform: none; }
  #docname { color: #CFC6E4; font: 600 12px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .menu { position: relative; }
  .drop { position: absolute; top: 38px; left: 0; z-index: 30; min-width: 250px; background: var(--paper); border: 2px solid var(--ink); border-radius: 8px;
    box-shadow: 4px 4px 0 rgba(0,0,0,.4); padding: 6px; display: none; }
  .drop.open { display: block; }
  .drop button { display: block; width: 100%; text-align: left; height: auto !important; padding: 7px 10px !important; margin: 2px 0; border: 0 !important;
    box-shadow: none !important; background: none !important; font: 600 13px "Segoe UI", system-ui, sans-serif !important; letter-spacing: 0 !important; border-radius: 5px !important; }
  .drop button:hover { background: var(--paper2) !important; transform: none !important; }
  .drop .note { font-size: 11px; color: var(--soft); padding: 2px 10px 6px; }
  .drop hr { border: 0; border-top: 1px dashed var(--line); margin: 5px 4px; }

  /* ---- side panels */
  aside { background: var(--paper); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  #left { border-right: 3px solid var(--ink); }
  #right { border-left: 3px solid var(--ink); }
  #tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 10px 10px 6px; }
  .tool { height: 44px; border: 2px solid var(--ink); border-radius: 8px; background: var(--paper2); cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1px; font: 900 9px var(--head); letter-spacing: .04em; }
  .tool i { font-style: normal; font-size: 17px; line-height: 1; }
  .tool.on { background: var(--sale); box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
  .tool kbd { font: 700 8px var(--mono); opacity: .6; }
  #sizes { display: flex; gap: 4px; align-items: center; padding: 0 10px 8px; font-size: 11px; color: var(--soft); }
  #sizes button { width: 26px; height: 22px; border: 2px solid var(--ink); border-radius: 5px; background: var(--paper2); cursor: pointer; font: 900 11px var(--head); }
  #sizes button.on { background: var(--ink); color: #fff; }
  #search { margin: 0 10px 6px; height: 30px; border: 2px solid var(--ink); border-radius: 7px; padding: 0 9px; background: #fff; }
  #recent { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 10px 6px; min-height: 0; }
  #recent .chip { display: flex; align-items: center; gap: 3px; border: 1.5px solid var(--line); border-radius: 6px; padding: 1px 4px 1px 2px; cursor: pointer; background: #fff; font-size: 11px; }
  #recent .chip canvas { width: 20px; height: 20px; }
  #recent .chip b { font: 700 9px var(--mono); color: var(--soft); }
  #recent .chip.on { border-color: var(--pink); background: #FFE5F2; }
  #palette { overflow-y: auto; padding: 0 6px 14px 10px; flex: 1; min-height: 0; }
  .group h4 { margin: 10px 0 3px; font: 900 11px var(--head); letter-spacing: .08em; text-transform: uppercase; display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  .group h4 small { font: 600 10px var(--mono); color: var(--soft); letter-spacing: 0; }
  .group.shut .items { display: none; }
  .group h4::before { content: '▾'; font-size: 10px; } .group.shut h4::before { content: '▸'; }
  .item { display: grid; grid-template-columns: 30px 1fr auto; gap: 7px; align-items: center; padding: 2px 4px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
  .item:hover { background: var(--paper2); }
  .item.on { border-color: var(--pink); background: #FFE5F2; }
  .item canvas { width: 30px; height: 30px; }
  .item span { font-size: 12.5px; line-height: 1.15; }
  .item kbd { font: 700 10px var(--mono); color: var(--soft); background: var(--paper2); border-radius: 4px; padding: 0 4px; }
  .kind { font: 900 9px var(--head); letter-spacing: .05em; padding: 1px 5px; border-radius: 4px; color: #fff; }

  /* ---- stage */
  #stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--paper); border: 2px solid var(--ink); border-radius: 8px;
    padding: 7px 14px; font-weight: 600; box-shadow: 3px 3px 0 rgba(0,0,0,.4); opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80%; }
  #toast.show { opacity: 1; }
  #hint { position: absolute; left: 34px; bottom: 12px; color: #CFC6E4; font-size: 12px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #layers { position: absolute; right: 10px; top: 26px; display: flex; flex-direction: column; gap: 3px; }
  #layers label { display: flex; align-items: center; gap: 5px; background: rgba(255,253,246,.92); border: 1.5px solid var(--ink); border-radius: 6px; padding: 2px 7px; font-size: 11px; font-weight: 600; cursor: pointer; }
  #zoombox { position: absolute; right: 10px; bottom: 12px; display: flex; gap: 4px; }
  #zoombox button { width: 30px; height: 28px; border: 2px solid var(--ink); border-radius: 6px; background: var(--paper); cursor: pointer; font-weight: 900; }

  /* ---- inspector */
  #tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 3px solid var(--ink); }
  #tabs button { height: 36px; border: 0; border-right: 2px solid var(--line); background: var(--paper2); cursor: pointer; font: 900 11px var(--head); letter-spacing: .04em; position: relative; }
  #tabs button.on { background: var(--paper); box-shadow: inset 0 -4px 0 var(--pink); }
  #tabs .badge { position: absolute; top: 3px; right: 4px; min-width: 16px; height: 16px; border-radius: 8px; font: 700 10px var(--mono); line-height: 16px; color: #fff; padding: 0 4px; }
  #panel { overflow-y: auto; padding: 4px 14px 24px; flex: 1; min-height: 0; }
  #panel h3 { margin: 16px 0 6px; font: 900 11.5px var(--head); letter-spacing: .08em; text-transform: uppercase; padding-bottom: 4px; border-bottom: 2px dashed var(--line); }
  #panel h2 { margin: 12px 0 2px; font: 900 16px var(--head); }
  #panel p.desc { margin: 2px 0 8px; color: var(--soft); font-size: 12px; }
  .row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 6px; align-items: center; margin: 5px 0; }
  .row > label { font-size: 12px; font-weight: 600; }
  .row > label small, .hint { display: block; font-weight: 400; font-size: 10.5px; color: var(--soft); }
  .row input[type=text], .row input[type=number], .row select, .row textarea, .full { width: 100%; height: 28px; border: 1.5px solid var(--soft); border-radius: 6px; padding: 0 7px; background: #fff; }
  .row textarea, textarea.full { height: 64px; padding: 5px 7px; resize: vertical; }
  .row input:focus, .row select:focus, textarea:focus, #search:focus { outline: 2px solid var(--pink); outline-offset: 0; }
  .seg { display: flex; gap: 3px; flex-wrap: wrap; }
  .seg button { min-width: 30px; height: 26px; border: 1.5px solid var(--soft); border-radius: 6px; background: #fff; cursor: pointer; font-weight: 700; padding: 0 7px; }
  .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .quad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .quad input { padding: 0 4px !important; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chips .c { display: inline-flex; align-items: center; gap: 4px; border: 2px solid var(--ink); border-radius: 14px; padding: 1px 3px 1px 9px; font-weight: 700; font-size: 12px; background: #fff; }
  .chips .c i { font-style: normal; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); }
  .chips .c button { border: 0; background: none; cursor: pointer; padding: 0 3px; font-weight: 900; color: var(--soft); }
  .acts { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
  .acts .btn { height: 28px; padding: 0 10px; font-size: 11px; }
  .msg { display: grid; grid-template-columns: 18px 1fr; gap: 6px; padding: 6px 8px; border-radius: 7px; margin: 4px 0; font-size: 12.5px; cursor: default; }
  .msg.loc { cursor: pointer; } .msg.loc:hover { filter: brightness(.96); }
  .msg.e { background: #FFE1E4; } .msg.w { background: #FFF1CC; } .msg.n { background: var(--paper2); } .msg.ok { background: #DDF7E6; }
  .msg b { font: 900 12px var(--head); }
  table.runs { width: 100%; border-collapse: collapse; font: 12px var(--mono); margin: 6px 0; }
  table.runs td, table.runs th { padding: 3px 4px; border-bottom: 1px dashed var(--line); text-align: right; }
  table.runs th { font: 900 10px var(--head); letter-spacing: .05em; }
  table.runs td:first-child, table.runs th:first-child { text-align: left; }
  .receipt { background: #fff; border: 1.5px dashed var(--soft); border-radius: 6px; padding: 8px 10px; font: 12px var(--mono); margin: 8px 0; white-space: pre; }
  .wp { display: grid; grid-template-columns: 22px 1fr 1fr 26px; gap: 4px; align-items: center; margin: 3px 0; font: 700 11px var(--mono); }
  .wp input { height: 26px; width: 100%; border: 1.5px solid var(--soft); border-radius: 5px; padding: 0 5px; }
  .wp button, .x { height: 26px; border: 1.5px solid var(--soft); border-radius: 5px; background: #fff; cursor: pointer; font-weight: 900; }
  .resize { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; align-items: center; justify-items: center; margin: 6px 0; }
  .resize .mid { font: 900 14px var(--head); }
  .resize .s2 button { width: 28px; height: 24px; border: 1.5px solid var(--ink); border-radius: 5px; background: #fff; cursor: pointer; font-weight: 900; margin: 0 1px; }
  .resize .s2 span { display: block; text-align: center; font-size: 10px; color: var(--soft); }

  /* ---- status bar */
  #status { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 12px; background: var(--deep); color: #CFC6E4; font: 12px var(--mono);
    border-top: 2px solid var(--ink); white-space: nowrap; overflow: hidden; }
  #status b { color: #fff; }
  #status .ok { color: #5BE08F; } #status .bad { color: #FF6B7A; cursor: pointer; } #status .meh { color: var(--warn); cursor: pointer; }
  #status .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; }

  /* ---- test drive and dialogs */
  #overlay { position: fixed; inset: 0; z-index: 50; background: rgba(10,8,18,.92); display: flex; flex-direction: column; }
  #overlay[hidden], #modal[hidden] { display: none; }
  #overlay .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--deep); border-bottom: 3px solid var(--ink); }
  #overlay .bar .t { color: #fff; font: 900 14px var(--head); letter-spacing: .05em; flex: 1; }
  #overlay .bar .t small { font: 12px "Segoe UI", system-ui; color: #CFC6E4; letter-spacing: 0; margin-left: 10px; }
  #overlay iframe { flex: 1; border: 0; width: 100%; background: #000; }
  #modal { position: fixed; inset: 0; z-index: 60; background: rgba(10,8,18,.7); display: flex; align-items: center; justify-content: center; }
  #modal .card { background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 6px 6px 0 rgba(0,0,0,.45); width: min(760px, 92vw);
    max-height: 88vh; display: flex; flex-direction: column; }
  #modal .card h2 { margin: 0; padding: 14px 18px 10px; font: 900 18px var(--head); border-bottom: 2px dashed var(--line); }
  #modal .card .body { padding: 12px 18px; overflow-y: auto; }
  #modal .card .foot { padding: 10px 18px 14px; display: flex; gap: 8px; justify-content: flex-end; border-top: 2px dashed var(--line); }
  #modal textarea { width: 100%; height: 46vh; font: 12px var(--mono); border: 2px solid var(--ink); border-radius: 8px; padding: 8px; white-space: pre; overflow: auto; }
  .help { columns: 2; column-gap: 26px; font-size: 12.5px; }
  .help h4 { margin: 8px 0 4px; font: 900 12px var(--head); letter-spacing: .05em; break-after: avoid; }
  .help p, .help li { margin: 2px 0; break-inside: avoid; }
  .help ul { padding-left: 16px; margin: 4px 0; }
  kbd { font: 700 11px var(--mono); background: var(--paper2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
  .drag #stage::after { content: 'Drop a level file (.json) to open it'; position: absolute; inset: 14px; border: 4px dashed var(--sale); border-radius: 14px;
    display: flex; align-items: center; justify-content: center; color: #fff; font: 900 20px var(--head); background: rgba(18,15,29,.7); }
</style>
</head>
<body>
<header id="top">
  <div class="brand"><span class="plate">DOORBUSTER</span><b>LEVEL EDITOR</b></div>
  <nav>
    <button id="bNew" title="Start a new level">New</button>
    <div class="menu"><button id="bOpen">Open ▾</button><div class="drop" id="mOpen"></div></div>
    <div class="menu"><button id="bExport" class="go">Export ▾</button><div class="drop" id="mExport"></div></div>
    <span class="sep"></span>
    <button id="bUndo" title="Undo (Ctrl+Z)">↶</button><button id="bRedo" title="Redo (Ctrl+Y)">↷</button>
    <span class="sep"></span>
    <button id="bPlay" class="hot" title="Drive the level yourself (Ctrl+Enter)">▶ Test drive</button>
    <button id="bBot" title="Watch the expert bot drive it (Ctrl+Shift+Enter)">Watch bot</button>
    <span class="sep"></span>
    <button id="bHelp" title="How to use the editor (F1)">? Help</button>
  </nav>
  <div id="docname"></div>
</header>
<aside id="left">
  <div id="tools"></div>
  <div id="sizes">Brush <button data-s="1" class="on">1</button><button data-s="2">2</button><button data-s="3">3</button><button data-s="5">5</button><span style="margin-left:auto">[ ]</span></div>
  <input id="search" placeholder="Search tiles and objects…  ( / )" autocomplete="off">
  <div id="recent"></div>
  <div id="palette"></div>
</aside>
<main id="stage">
  <canvas id="cv"></canvas>
  <div id="layers"></div>
  <div id="zoombox"><button id="zOut" title="Zoom out (-)">−</button><button id="zFit" title="Fit the map (F)">⤢</button><button id="zIn" title="Zoom in (+)">+</button></div>
  <div id="hint"></div>
  <div id="toast"></div>
</main>
<aside id="right">
  <div id="tabs"><button data-tab="level">LEVEL</button><button data-tab="sel">SELECTION</button><button data-tab="zones">ZONES</button><button data-tab="check">CHECK<span class="badge" id="badge"></span></button></div>
  <div id="panel"></div>
</aside>
<footer id="status"></footer>
<div id="overlay" hidden>
  <div class="bar"><div class="t" id="ovTitle">TEST DRIVE</div>
    <button class="btn" id="ovRestart" title="Start the run again">↻ Restart</button>
    <button class="btn" id="ovSwap">Watch bot</button>
    <button class="btn hot" id="ovClose" title="Back to the editor (Esc when the editor has focus)">✕ Back to editor</button></div>
  <iframe id="game" title="DOORBUSTER test drive" allow="autoplay"></iframe>
</div>
<div id="modal" hidden><div class="card"><h2 id="mTitle"></h2><div class="body" id="mBody"></div><div class="foot" id="mFoot"></div></div></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script type="module" src="editor.js"></script>
</body>
</html>
