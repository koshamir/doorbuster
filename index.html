<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="DOORBUSTER — Black Friday at the mall. Race a shopping cart, sweep the shelves on the move, build a wobbling tower of loot and crash into a checkout before the store closes.">
<title>DOORBUSTER</title>
<link rel="icon" href="data:,">
<!--
  DOORBUSTER — index.html
  Purpose: the page shell: one canvas, one interface layer, all interface CSS, and the entry module.
  Loads: src/main.js (ES module), which loads three.js r185 (global THREE) through src/platform.js:
         the Mindblown-hosted bundle on the platform, lib/three.min.js anywhere else.
  Interface look (ART.md 5): receipts and price tags — white paper with a serrated edge, monospaced
  digits, yellow-and-black sale plates, big bold outlined type. One palette with the 3D (config.js PAL).
  Sizes hang off one unit (--u), which is larger on tall (phone) screens so digits stay readable.
-->
<style>
  :root { --night: #1E1B2E; --sale: #FFD23F; --danger: #FF3B4E; --pink: #FF4FA3; --teal: #00D1C1; --paper: #FFFDF6;
    --ink: #2A1A3A; --u: min(1vw, 1.78vh); --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  @media (max-aspect-ratio: 1/1) { :root { --u: 1.9vw; } }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); }
  body { font-family: "Arial Black", "Segoe UI Black", "Helvetica Neue", Impact, system-ui, sans-serif; color: var(--ink);
    -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    pointer-events: none; font-size: calc(var(--u) * 1.6); }
  b { font-weight: 900; }

  /* ---- in-run screen ---- */
  .hud { position: absolute; inset: 0; transition: opacity .2s; }
  .hud.off { opacity: 0; }
  .lbl { display: block; font-size: max(.5em, 9px); letter-spacing: .12em; opacity: .8; }
  .plate { position: absolute; top: 2.2%; left: 50%; transform: translateX(-50%) rotate(-1.5deg); background: var(--sale); color: var(--night);
    padding: .25em .9em .2em; border: .16em solid var(--night); border-radius: .45em; box-shadow: 0 .22em 0 var(--night); text-align: center; line-height: 1; }
  .plate b { font: 900 2em/1 var(--mono); }
  .plate.hot { background: var(--danger); color: #fff; animation: throb .5s infinite alternate; }
  .tag { position: absolute; top: 2.2%; right: 2%; background: var(--paper); color: var(--night); padding: .3em .8em .25em 1.3em; line-height: 1;
    border: .16em solid var(--night); border-radius: .3em .5em .5em .3em; box-shadow: 0 .22em 0 var(--night); text-align: right; transform: rotate(1.5deg); }
  .tag::before { content: ""; position: absolute; left: .4em; top: 50%; width: .45em; height: .45em; margin-top: -.22em; border-radius: 50%; background: var(--night); }
  .tag b { font: 900 1.7em/1 var(--mono); display: inline-block; }
  .tag b.bump, .meter b.bump { animation: bump .18s; }
  .tag b.drop { animation: drop .35s; }
  .place { position: absolute; top: calc(2.2% + 3.5em); right: 2.6%; background: var(--night); color: #fff; padding: .12em .55em; border-radius: .4em;
    font-size: 1.25em; transform: rotate(1.5deg); opacity: 0; }
  .place.in { opacity: 1; } .place.first { background: var(--sale); color: var(--night); }
  .pausebtn { position: absolute; top: calc(2.2% + 8em); right: 2.6%; width: 2.3em; height: 2.3em; font: inherit; font-size: .9em; letter-spacing: .1em; color: #fff;
    background: var(--night); border: 0; border-radius: .5em; opacity: .8; pointer-events: auto; cursor: pointer; }
  .touching .pausebtn { min-width: 44px; min-height: 44px; }
  .meter { position: absolute; top: calc(2.2% + .8em); left: 2%; transform: rotate(-1.5deg); display: flex; align-items: center; gap: .3em; background: var(--night);
    color: #fff; padding: .35em .6em; border-radius: .45em; box-shadow: 0 .22em 0 rgba(30, 27, 46, .45); }
  .meter .lbl { position: absolute; left: .7em; top: -1.5em; color: #fff; opacity: 1; font-size: max(.55em, 9px); text-shadow: 0 .12em 0 var(--night); -webkit-text-stroke: .25em var(--night); paint-order: stroke fill; }
  .seg { width: 1.25em; height: .95em; background: #4A3D66; border-radius: .2em; overflow: hidden; }
  .seg.last { width: 1.9em; border-radius: .2em .5em .5em .2em; } .seg.last i { background: var(--pink); }
  @media (max-aspect-ratio: 1/1) { .seg { width: 1em; } .seg.last { width: 1.5em; } .meter { gap: .22em; } }
  .seg i { display: block; height: 100%; width: 0; background: var(--sale); } .seg.part i { opacity: .5; }
  .meter b { font: 900 1.7em/1 var(--mono); color: var(--sale); min-width: 1.5em; text-align: right; display: inline-block; }
  .hud.mad .seg i { background: var(--pink); } .hud.mad .meter b { color: var(--pink); }
  .hud.mad::after { content: ""; position: absolute; inset: 0; border: 1em solid; border-image: repeating-linear-gradient(45deg, var(--pink) 0 1.2em, var(--sale) 1.2em 2.4em) 40;
    animation: wild .22s infinite alternate; }
  .list { position: absolute; top: calc(2.2% + 4em); left: 2.2%; display: flex; gap: .35em; }
  .list div { position: relative; width: 2.3em; height: 2.3em; background: var(--paper) center / 86% no-repeat; border: .14em solid var(--night); border-radius: .4em;
    box-shadow: 0 .16em 0 var(--night); }
  .list div.got { background-color: var(--teal); animation: bump .25s; }
  .list div.got::after { content: ""; position: absolute; right: .2em; bottom: .3em; width: .45em; height: .85em; border: solid var(--night); border-width: 0 .24em .24em 0; transform: rotate(40deg); }
  /* the announcer's line has its own place, at the left under the list: pop-up words, prices and the arrow never share it */
  .news { position: absolute; top: 25%; left: 2%; transform-origin: 0 50%; transform: scale(.7); opacity: 0; background: var(--paper); max-width: min(34vw, 25em);
    border: .16em solid var(--night); border-radius: .5em; padding: .3em .9em .35em; box-shadow: 0 .22em 0 var(--night); text-align: left; line-height: 1.1;
    transition: transform .2s cubic-bezier(.3, 1.7, .5, 1), opacity .15s; }
  .news.in { opacity: 1; transform: scale(1); }
  @media (max-aspect-ratio: 1/1) { .news { top: 22%; left: 4%; right: 4%; max-width: none; text-align: center; transform-origin: 50% 50%; } }
  .news b { display: block; font-size: 1.5em; color: var(--danger); }
  .news span { font: 700 .8em/1.2 system-ui, "Segoe UI", sans-serif; }
  .hud-pop { position: absolute; top: 13.5%; left: 50%; transform: translateX(-50%) rotate(-3deg) scale(.4); opacity: 0; background: var(--sale); color: var(--night);
    border: .09em solid var(--night); border-radius: .22em; padding: .02em .4em; box-shadow: 0 .1em 0 var(--night); font-size: 2.5em; white-space: nowrap; }
  .hud-pop.in { opacity: 1; transform: translateX(-50%) rotate(-3deg) scale(1); transition: transform .16s cubic-bezier(.3, 1.9, .5, 1), opacity .06s; }
  .hud-pop.bad { background: var(--danger); color: #fff; } .hud-pop.good { background: var(--teal); } .hud-pop.hot { background: var(--pink); color: #fff; }
  .hud-count { position: absolute; left: 0; right: 0; top: 28%; text-align: center; font-size: 9em; color: #fff; opacity: 0; letter-spacing: .02em;
    -webkit-text-stroke: .1em var(--night); paint-order: stroke fill; text-shadow: 0 .09em 0 var(--night), 0 .18em 0 rgba(30, 27, 46, .35); }
  .hud-count.in { animation: count .75s both; }
  .float { position: absolute; left: 0; top: 0; margin: -1em 0 0 -2em; width: 4em; text-align: center; font-size: 1.25em; color: #fff; opacity: 0;
    -webkit-text-stroke: .16em var(--night); paint-order: stroke fill; transition: opacity .25s; will-change: transform; }
  .float.in { opacity: 1; transition: none; }
  .bubble { position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0; }
  .bubble.in { opacity: 1; }
  .bubble .pop { display: block; transform-origin: 0 0; }
  .bubble.in .pop { animation: bubpop .12s cubic-bezier(.3, 1.8, .5, 1) both; }
  .bubble b { display: block; position: relative; width: max-content; max-width: 13em; transform: translate(-50%, calc(-100% - .9em)) rotate(var(--tilt, -2deg)); background: #fff; color: var(--night);
    border: 3px solid var(--night); border-radius: .8em; padding: .32em .7em .26em; font: 900 1.05em/1.05 "Arial Narrow", "Roboto Condensed", "Segoe UI", system-ui, sans-serif; text-transform: uppercase; letter-spacing: .01em; box-shadow: 0 .16em 0 var(--night); text-align: center; }
  .bubble b::after { content: ''; position: absolute; left: calc(50% - .45em); bottom: -.58em; width: .8em; height: .8em; background: #fff; border-right: 3px solid var(--night); border-bottom: 3px solid var(--night); transform: rotate(45deg); }
  @keyframes bubpop { from { transform: scale(.35); } to { transform: scale(1); } }
  .emote { position: absolute; left: 0; top: 0; width: 4.2vh; height: 4.2vh; margin: -2.1vh 0 0 -2.1vh; opacity: 0; pointer-events: none; }
  .sticker { position: absolute; left: 0; top: 0; width: 26.3vh; height: 16.6vh; margin: -8.3vh 0 0 -13.15vh; opacity: 0; pointer-events: none; will-change: transform, opacity; }
  .float.name { width: 12em; margin-left: -6em; font-size: 1em; letter-spacing: .04em; white-space: nowrap; }
  .float.list { color: var(--teal); } .float.big { color: var(--sale); font-size: 1.7em; } .float.loss { color: var(--danger); font-size: 2em; width: 6em; margin-left: -3em; }
  .float.chain { font-size: 1.9em; width: 6em; margin-left: -3em; }
  .float.chain.bump { animation: bump .12s; }
  .float.warn { font-size: 2.4em; width: 1.15em; height: 1.15em; line-height: 1.15em; margin: -2em 0 0 -.58em; color: #fff; background: var(--danger); border-radius: 50%;
    border: .08em solid var(--night); -webkit-text-stroke: 0; animation: beat .16s infinite alternate; }
  .arrow { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; }
  .arrow.in { opacity: 1; }
  .arrow i { position: absolute; left: -1.15em; top: -1.6em; width: 2.3em; height: 3.2em; background: var(--night);
    clip-path: polygon(50% 0, 100% 56%, 70% 56%, 70% 100%, 30% 100%, 30% 56%, 0 56%); }
  .arrow i::after { content: ""; position: absolute; inset: 0; background: var(--sale); clip-path: polygon(50% 11%, 86% 51%, 62% 51%, 62% 95%, 38% 95%, 38% 51%, 14% 51%); }
  .arrow b { position: absolute; left: -3em; top: 1.75em; width: 6em; text-align: center; font-size: .85em; color: var(--sale); -webkit-text-stroke: .22em var(--night); paint-order: stroke fill; }

  .hint-keys { position: absolute; left: 0; top: 0; display: flex; gap: .3em; margin: -5em 0 0 3.2em; opacity: 0; transition: opacity .3s; }
  .hint-keys.in { opacity: 1; animation: beat .45s infinite alternate; }
  .hint-keys b { min-width: 1.5em; height: 1.5em; line-height: 1.5em; padding: 0 .15em; text-align: center; font-size: 1.25em; background: var(--paper);
    border: .14em solid var(--night); border-radius: .3em; box-shadow: 0 .2em 0 var(--night); }
  .hint-keys b.wide { font-size: .9em; height: 2.1em; line-height: 2.1em; padding: 0 .6em; }

  /* ---- touch controls: steering under the left thumb, actions under the right ---- */
  .touch { position: absolute; inset: 0; }
  .hud.off ~ .touch { display: none; }
  .pad { position: absolute; bottom: 5%; width: 5.2em; height: 5.2em; line-height: 5.2em; text-align: center; font-size: 1.25em; border-radius: 50%;
    background: rgba(255, 253, 246, .82); color: var(--night); border: .2em solid var(--night); box-shadow: 0 .3em 0 var(--night); pointer-events: auto; touch-action: none; }
  .pad.on { transform: translateY(.2em); box-shadow: 0 .1em 0 var(--night); background: var(--sale); }
  .pad.l1 { left: 3%; } .pad.l2 { left: calc(3% + 6em); } .pad.r2 { right: calc(3% + 6em); font-size: 1.05em; width: 5.6em; height: 5.6em; line-height: 5.6em; }
  .pad.r1 { right: 3%; background: rgba(255, 79, 163, .92); color: #fff; }
  .pad.r3 { right: 3%; bottom: calc(5% + 7.4em); font-size: .9em; width: 4.6em; height: 4.6em; line-height: 4.6em; }

  /* ---- full screens ---- */
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: .7em;
    pointer-events: auto; text-align: center; }
  .screen.on { display: flex; }
  .screen.title { justify-content: space-between; padding: 3.5% 0 2.5%; box-sizing: border-box;
    background: linear-gradient(rgba(30, 27, 46, .7), rgba(30, 27, 46, 0) 38%, rgba(30, 27, 46, 0) 62%, rgba(30, 27, 46, .75)); }
  .screen.closed { background: radial-gradient(ellipse at 50% 40%, rgba(30, 27, 46, .25), rgba(30, 27, 46, .82)); }
  .screen.pause { background: rgba(30, 27, 46, .74); }
  .panel { display: flex; flex-direction: column; gap: .6em; min-width: 15em; background: var(--paper); border: .16em solid var(--night); border-radius: .6em;
    padding: 1em 1.3em; box-shadow: 0 .3em 0 var(--night); }
  .slide { display: flex; align-items: center; gap: 1em; font-size: .9em; } .slide input { flex: 1; accent-color: var(--pink); }
  .btn-row { display: flex; gap: .8em; flex-wrap: wrap; justify-content: center; }
  .card { display: flex; gap: .6em; justify-content: center; margin-bottom: 1em; }
  .stampbox { font: inherit; width: 9.5em; padding: .45em .4em; line-height: 1.25; color: var(--night); background: var(--paper); border: .16em solid var(--night);
    border-radius: .5em; box-shadow: 0 .25em 0 var(--night); cursor: pointer; }
  .stampbox.on { background: var(--sale); transform: translateY(-.25em) rotate(-1.5deg); }
  .stampbox.locked { opacity: .55; cursor: default; }
  .stampbox .lbl { font-size: .6em; opacity: .9; } .stampbox span:last-child { display: block; font: 700 .8em var(--mono); }
  .medal { display: block; } .m1 { color: #A8591B; } .m2 { color: #5F6C7B; } .m3 { color: #B88700; } .m4 { color: var(--night); }
  .screen.receipt { background: linear-gradient(90deg, rgba(30, 27, 46, 0) 30%, rgba(30, 27, 46, .6) 75%); align-items: flex-end; padding-right: 6%; box-sizing: border-box; }
  @media (max-aspect-ratio: 1/1) { .screen.receipt { align-items: center; justify-content: flex-start; padding: 5% 0 0; background: rgba(30, 27, 46, .35); } }
  .screen.title .logo { font-size: min(5.6em, 10vw); }
  .logo { font-size: min(7em, 12vw); line-height: .9; color: var(--sale); transform: rotate(-4deg); letter-spacing: -.01em;
    -webkit-text-stroke: .09em var(--night); paint-order: stroke fill; text-shadow: 0 .07em 0 var(--night), .05em .14em 0 var(--pink); animation: pop .35s both; }
  .logo.small { font-size: min(5em, 11vw); color: var(--danger); text-shadow: 0 .07em 0 var(--night); }
  .sub { font-size: 1.5em; color: #fff; -webkit-text-stroke: .22em var(--night); paint-order: stroke fill; letter-spacing: .06em; margin-top: .5em; }
  .hint { font: 700 .9em/1.3 system-ui, "Segoe UI", sans-serif; color: #fff; opacity: .9; text-shadow: 0 1px 0 var(--night); margin-top: 1.1em; }
  .btn { font: inherit; font-size: 1.5em; color: var(--night); background: var(--sale); border: .16em solid var(--night); border-radius: .6em;
    padding: .3em 1.2em; box-shadow: 0 .28em 0 var(--night); cursor: pointer; transition: transform .08s, box-shadow .08s; }
  .btn.big { font-size: 2.4em; background: var(--pink); color: #fff; animation: throb2 .7s infinite alternate; }
  .btn.small { font-size: 1em; } .btn.go { background: var(--teal); }
  /* the Mall Directory: a map board of store fronts round a concourse */
  .screen.directory { background: radial-gradient(ellipse at 50% 45%, rgba(30, 27, 46, .35), rgba(30, 27, 46, .88)); gap: 1em; }
  .board { width: min(62em, 94vw); background: var(--night); border: .3em solid var(--sale); border-radius: 1em; padding: .9em 1.1em 1.2em; box-shadow: 0 .4em 0 #000a, inset 0 0 0 .2em #2A2440; transform: rotate(-.6deg); }
  .board-head, .cat-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .7em; gap: 1em; }
  .mplate { font: 900 1.7em/1 'Arial Black', Impact, sans-serif; color: var(--night); background: var(--sale); padding: .2em .55em; border: .14em solid var(--night); border-radius: .35em; transform: rotate(-2deg); box-shadow: 0 .14em 0 var(--night); letter-spacing: .04em; }
  .wallet { font: 700 1.05em var(--mono); color: var(--night); background: var(--paper); padding: .3em .7em; border-radius: .3em; border: .12em dashed var(--ink); }
  .mall { display: flex; flex-direction: column; gap: .5em; }
  .shops { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: .55em; }
  .concourse { position: relative; height: 2.2em; border-radius: 1.1em; background: repeating-linear-gradient(90deg, #3A335A 0 1.4em, #342E52 1.4em 2.8em); display: flex; align-items: center; padding-left: 1em; }
  .here { font: 900 .85em 'Arial Black', Impact, sans-serif; color: var(--sale); animation: throb2 .8s infinite alternate; }
  .front { font: inherit; position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: .15em; text-align: left; padding: 1.25em .6em .55em; min-height: 7.2em; color: var(--night); background: var(--paper);
    border: .16em solid var(--night); border-radius: .4em; cursor: pointer; overflow: hidden; box-shadow: 0 .2em 0 var(--night); }
  .front:hover { transform: translateY(-.15em); }
  .front .awning { position: absolute; left: 0; right: 0; top: 0; height: .85em; background: repeating-linear-gradient(90deg, var(--a) 0 .9em, #fff .9em 1.8em); border-bottom: .14em solid var(--night); }
  .front .unit { font: 700 .55em var(--mono); opacity: .6; }
  .front .sname { font: 900 .95em/1.05 'Arial Black', Impact, sans-serif; color: var(--c); -webkit-text-stroke: .02em var(--night); max-width: 54%; }
  .front .mode { font: 900 .6em 'Arial Black', Impact, sans-serif; color: #fff; background: var(--night); padding: .1em .4em; border-radius: .2em; transform: rotate(-3deg); }
  .front .medal { font: 900 .7em 'Arial Black', Impact, sans-serif; }
  .front .sbest { font: 700 .7em var(--mono); }
  .front .window { position: absolute; right: .7em; bottom: .7em; width: 42%; height: 58%; border: .14em solid var(--night); border-radius: .3em; display: flex; align-items: flex-end; justify-content: center;
    background: radial-gradient(ellipse 55% 50% at 50% 42%, #fff9 0, #fff0 70%), linear-gradient(transparent 62%, #1E1B2Ecc), linear-gradient(var(--a) 0 66%, transparent 66%),
      repeating-conic-gradient(var(--f) 0 25%, #fff 0 50%) 0 0 / 1em 1em; box-shadow: inset 0 .3em 0 #fff6; overflow: hidden; }
  .front .window img { position: absolute; left: 50%; top: 36%; height: 104%; transform: translate(-50%, -50%); filter: drop-shadow(0 .15em 0 #0005); }
  .front .window b { position: relative; font: 900 .62em 'Arial Black', Impact, sans-serif; color: var(--sale); padding: .15em .5em; margin-bottom: .25em; text-align: center; background: var(--night); border-radius: .3em; }
  .front .next { position: absolute; right: -.2em; top: 1.2em; font: 900 .7em 'Arial Black', Impact, sans-serif; color: #fff; background: var(--danger); padding: .15em .5em; transform: rotate(12deg); border: .12em solid var(--night); }
  .front.rec { animation: recpulse .7s infinite alternate; }
  @keyframes recpulse { from { box-shadow: 0 .2em 0 var(--night), 0 0 0 .1em var(--sale); } to { box-shadow: 0 .2em 0 var(--night), 0 0 0 .5em var(--sale); } }
  @media (max-width: 700px) { .shops { grid-template-columns: repeat(2, 1fr); } .front { min-height: 5.6em; } }
  /* Cart Customs: a catalogue page of price tags round the turntable */
  .screen.customs { background: radial-gradient(ellipse at 50% 55%, rgba(255, 214, 224, 0) 18%, rgba(30, 27, 46, .55) 70%); justify-content: space-between; padding: 2% 0; box-sizing: border-box; gap: .6em; }
  .cat-head { width: min(64em, 96vw); }
  .cat { display: flex; width: min(64em, 96vw); justify-content: space-between; align-items: flex-start; gap: 1em; flex: 1; min-height: 0; }
  .cat .stage { flex: 1; }
  .cat .col { width: min(19em, 36vw); background: var(--paper); border: .16em solid var(--night); border-radius: .5em; padding: .6em .7em; box-shadow: 0 .25em 0 var(--night); max-height: 100%; overflow: auto; box-sizing: border-box; }
  .col-head { font: 900 1em 'Arial Black', Impact, sans-serif; border-bottom: .14em dashed var(--ink); margin: .2em 0 .4em; }
  .uprow { margin-bottom: .5em; } .uname { display: block; font: 900 .8em 'Arial Black', Impact, sans-serif; margin-bottom: .2em; }
  .cat .tag { font: inherit; display: inline-flex; flex-direction: column; width: 31%; margin-right: 2%; padding: .3em .25em .3em .6em; text-align: left; cursor: pointer; background: #fff; color: var(--night);
    border: .12em solid var(--night); border-radius: .2em .9em .9em .2em; position: relative; vertical-align: top; box-sizing: border-box; }
  .cat .tag::before { content: ''; position: absolute; left: .18em; top: 50%; width: .22em; height: .22em; margin-top: -.11em; border-radius: 50%; background: var(--night); }
  .cat .tag .tname, .chip .pname, .swatch .pname { font: 700 .58em/1.1 var(--mono); } .cat .tag .tprice, .chip .tprice, .swatch .tprice { font: 900 .72em 'Arial Black', Impact, sans-serif; }
  .cat .tag.owned { background: var(--teal); } .cat .tag.can, .swatch.can, .chip.can { background: var(--sale); animation: throb2 .6s infinite alternate; }
