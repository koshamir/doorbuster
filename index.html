<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="DOORBUSTER — Black Friday at the mall. Race a shopping cart, sweep the shelves on the move, build a wobbling tower of loot and crash into a checkout before the store closes.">
<title>DOORBUSTER</title>
<link rel="icon" href="data:,">
<!--
  DOORBUSTER — index.html
  Purpose: the page shell: one canvas, one interface layer, all interface CSS, and the entry module.
  Loads: src/main.js (ES module), which loads three.js r185 (global THREE) through src/platform.js:
         the Mindblown-hosted bundle on the platform, lib/three.min.js anywhere else.
  Interface look (ART.md 5): receipts and price tags — white paper with a serrated edge, monospaced
  digits, yellow-and-black sale plates, big bold outlined type. One palette with the 3D (config.js PAL).
-->
<style>
  :root { --night: #1E1B2E; --sale: #FFD23F; --danger: #FF3B4E; --pink: #FF4FA3; --teal: #00D1C1; --paper: #FFFDF6;
    --ink: #2A1A3A; --u: min(1vw, 1.78vh); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); }
  body { font-family: "Arial Black", "Segoe UI Black", "Helvetica Neue", Impact, system-ui, sans-serif; color: var(--ink);
    -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; font-size: calc(var(--u) * 1.6); }
  b { font-weight: 900; }

  /* ---- in-run screen ---- */
  .hud { position: absolute; inset: 0; transition: opacity .2s; }
  .hud.off { opacity: 0; }
  .lbl { display: block; font-size: .5em; letter-spacing: .12em; opacity: .75; }
  .plate { position: absolute; top: 2.2%; left: 50%; transform: translateX(-50%) rotate(-1.5deg); background: var(--sale); color: var(--night);
    padding: .25em .9em .2em; border: .16em solid var(--night); border-radius: .45em; box-shadow: 0 .22em 0 var(--night); text-align: center; line-height: 1; }
  .plate b { font: 900 2em/1 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  .plate.hot { background: var(--danger); color: #fff; animation: throb .5s infinite alternate; }
  .tag { position: absolute; top: 2.2%; right: 2%; background: var(--paper); color: var(--night); padding: .3em .8em .25em 1.3em; line-height: 1;
    border: .16em solid var(--night); border-radius: .3em .5em .5em .3em; box-shadow: 0 .22em 0 var(--night); text-align: right; transform: rotate(1.5deg); }
  .tag::before { content: ""; position: absolute; left: .4em; top: 50%; width: .45em; height: .45em; margin-top: -.22em; border-radius: 50%; background: var(--night); }
  .tag b { font: 900 1.7em/1 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; display: inline-block; }
  .tag b.bump { animation: bump .18s; }
  .hud-pop, .hud-count { position: absolute; left: 0; right: 0; text-align: center; color: var(--sale); opacity: 0; transform: scale(.4) rotate(-4deg);
    -webkit-text-stroke: .1em var(--night); paint-order: stroke fill; text-shadow: 0 .09em 0 var(--night), 0 .18em 0 rgba(30, 27, 46, .35); letter-spacing: .02em; }
  .hud-pop { top: 20%; font-size: 4.2em; }
  .hud-pop.in { opacity: 1; transform: scale(1) rotate(-4deg); transition: transform .16s cubic-bezier(.3, 1.9, .5, 1), opacity .08s; }
  .hud-pop.bad { color: var(--danger); } .hud-pop.good { color: var(--teal); } .hud-pop.hot { color: var(--pink); }
  .hud-count { top: 28%; font-size: 9em; color: #fff; }
  .hud-count.in { animation: count .75s both; }
  .float { position: absolute; left: 0; top: 0; margin: -1em 0 0 -2em; width: 4em; text-align: center; font-size: 1.25em; color: #fff; opacity: 0;
    -webkit-text-stroke: .16em var(--night); paint-order: stroke fill; transition: opacity .25s; will-change: transform; }
  .float.in { opacity: 1; transition: none; }
  .float.list { color: var(--teal); } .float.big { color: var(--sale); font-size: 1.7em; }
  .float.chain { font-size: 1.9em; width: 6em; margin-left: -3em; }
  .float.chain.bump { animation: bump .12s; }

  /* ---- full screens ---- */
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: .7em;
    pointer-events: auto; text-align: center; }
  .screen.on { display: flex; }
  .screen.title, .screen.closed { background: radial-gradient(ellipse at 50% 40%, rgba(30, 27, 46, .25), rgba(30, 27, 46, .82)); }
  .screen.receipt { background: rgba(30, 27, 46, .55); }
  .logo { font-size: 7em; line-height: .9; color: var(--sale); transform: rotate(-4deg); letter-spacing: -.01em;
    -webkit-text-stroke: .09em var(--night); paint-order: stroke fill; text-shadow: 0 .07em 0 var(--night), .05em .14em 0 var(--pink); animation: pop .35s both; }
  .logo.small { font-size: 5em; color: var(--danger); text-shadow: 0 .07em 0 var(--night); }
  .sub { font-size: 1.5em; color: #fff; -webkit-text-stroke: .22em var(--night); paint-order: stroke fill; letter-spacing: .06em; }
  .hint { font: 700 .9em/1.3 system-ui, "Segoe UI", sans-serif; color: #fff; opacity: .85; text-shadow: 0 1px 0 var(--night); }
  .btn { font: inherit; font-size: 1.5em; color: var(--night); background: var(--sale); border: .16em solid var(--night); border-radius: .6em;
    padding: .3em 1.2em; box-shadow: 0 .28em 0 var(--night); cursor: pointer; transition: transform .08s, box-shadow .08s; }
  .btn.big { font-size: 2.4em; background: var(--pink); color: #fff; animation: throb .7s infinite alternate; }
  .btn:hover { transform: translateY(-.06em); }
  .btn:active { transform: translateY(.2em); box-shadow: 0 .08em 0 var(--night); }
  .screen.receipt .btn { opacity: 0; pointer-events: none; }
  .screen.receipt .btn.in { opacity: 1; pointer-events: auto; animation: pop .25s both; }
  .paper { width: min(24em, 86vw); background: var(--paper); padding: 1.1em 1.3em 1.5em; transform: rotate(-1.2deg); cursor: pointer;
    font: 700 1em/1.5 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; box-shadow: 0 .5em 0 rgba(30, 27, 46, .5);
    --tooth: .7em; -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/var(--tooth) 51% repeat-x,
      conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top/var(--tooth) 51% repeat-x;
    mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/var(--tooth) 51% repeat-x,
      conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top/var(--tooth) 51% repeat-x; animation: print .4s both; }
  .paper-head { font: 900 1.6em/1.1 "Arial Black", Impact, sans-serif; letter-spacing: .08em; }
  .paper-sub { font-size: .7em; opacity: .6; border-bottom: .14em dashed var(--ink); padding-bottom: .6em; margin-bottom: .5em; }
  .line { display: flex; justify-content: space-between; opacity: 0; }
  .line.in { opacity: 1; animation: bump .15s; }
  .line.total { border-top: .14em dashed var(--ink); margin-top: .5em; padding-top: .35em; font-size: 1.7em; }
  @keyframes throb { from { transform: translateX(-50%) rotate(-1.5deg) scale(1); } to { transform: translateX(-50%) rotate(-1.5deg) scale(1.07); } }
  .btn.big { animation-name: throb2; } @keyframes throb2 { from { transform: scale(1); } to { transform: scale(1.06); } }
  @keyframes bump { from { scale: 1.3; } to { scale: 1; } }
  @keyframes pop { from { opacity: 0; transform: scale(.5) rotate(-9deg); } 70% { transform: scale(1.08) rotate(-3deg); } }
  @keyframes count { 0% { opacity: 0; transform: scale(2.4); } 18% { opacity: 1; transform: scale(1); } 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.7); } }
  @keyframes print { from { transform: translateY(-110%) rotate(-1.2deg); } to { transform: translateY(0) rotate(-1.2deg); } }

  /* ---- debug panel (?debug=1) ---- */
  .dbg { position: absolute; left: 8px; top: 8px; width: 330px; max-height: 96%; overflow: auto; pointer-events: auto;
    background: rgba(30, 27, 46, 0.86); color: #FFF6EA; font: 11px/1.35 ui-monospace, Menlo, Consolas, monospace;
    padding: 8px; border-radius: 10px; }
  .dbg-read { margin: 0 0 6px; white-space: pre-wrap; }
  .dbg-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .dbg-btn { font: inherit; color: #1E1B2E; background: #FFD23F; border: 0; border-radius: 6px; padding: 3px 7px; cursor: pointer; }
  .dbg-line { display: grid; grid-template-columns: 96px 1fr 44px; gap: 6px; align-items: center; }
  .dbg-line input { width: 100%; margin: 0; }
  .dbg-val { text-align: right; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
